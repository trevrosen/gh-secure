name: Cache and retain CI files
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache
          key: test-cache
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results/
